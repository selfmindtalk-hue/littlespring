<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>요즘 내 마음은..? 엄마 마음 온도 테스트</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --pink-light: #FBEAF0;
    --pink-mid: #ED93B1;
    --pink: #D4537E;
    --pink-dark: #993556;
    --pink-deep: #4B1528;
    --text-primary: #1a1a1a;
    --text-secondary: #6b6b6b;
    --text-tertiary: #aaa;
    --bg: #fdfaf8;
    --card-bg: #ffffff;
    --border: #e8ddd8;
    --border-hover: #D4537E;
    --radius: 14px;
    --radius-sm: 8px;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px 60px;
  }

  .container {
    width: 100%;
    max-width: 520px;
  }

  /* INTRO */
  .intro {
    text-align: center;
    padding: 48px 24px;
    background: var(--card-bg);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    animation: fadeUp 0.5s ease;
  }
  .intro-icon { font-size: 48px; margin-bottom: 20px; }
  .intro h1 {
    font-family: 'Noto Serif KR', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 12px;
    line-height: 1.4;
  }
  .intro p {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.85;
    margin-bottom: 28px;
  }

  /* PROGRESS */
  .progress-wrap {
    margin-bottom: 28px;
  }
  .progress-bar {
    height: 3px;
    background: #edddd7;
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #ED93B1, #D4537E);
    border-radius: 2px;
    transition: width 0.4s ease;
  }
  .progress-label {
    font-size: 11px;
    color: var(--text-tertiary);
    text-align: right;
    letter-spacing: 0.04em;
  }

  /* QUESTION */
  .q-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 28px 24px 24px;
    animation: fadeUp 0.35s ease;
  }
  .q-num {
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--pink);
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .q-text {
    font-family: 'Noto Serif KR', serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.5;
    margin-bottom: 6px;
  }
  .q-sub {
    font-size: 13px;
    color: var(--text-tertiary);
    margin-bottom: 20px;
    line-height: 1.6;
  }
  .opts { display: flex; flex-direction: column; gap: 9px; }

  .opt {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fdfaf8;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 13px 15px;
    cursor: pointer;
    text-align: left;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    color: var(--text-primary);
    transition: all 0.15s ease;
    width: 100%;
    line-height: 1.5;
  }
  .opt:hover {
    border-color: var(--pink-mid);
    background: #fff5f8;
  }
  .opt.selected {
    border-color: var(--pink) !important;
    background: var(--pink-light) !important;
    color: var(--pink-deep) !important;
  }
  .opt.selected .opt-emoji {
    transform: scale(1.15);
  }
  .opt-emoji {
    font-size: 20px;
    min-width: 26px;
    text-align: center;
    transition: transform 0.15s ease;
    display: inline-block;
  }

  /* NAV */
  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
  }
  .btn-back {
    background: none;
    border: none;
    font-size: 13px;
    color: var(--text-tertiary);
    cursor: pointer;
    padding: 8px 4px;
    font-family: 'Noto Sans KR', sans-serif;
    transition: color 0.15s;
  }
  .btn-back:hover { color: var(--text-secondary); }
  .btn-back.hidden { visibility: hidden; pointer-events: none; }

  .btn-next {
    background: var(--pink);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    padding: 11px 28px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn-next:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
  .btn-next:active:not(:disabled) { transform: translateY(0); }
  .btn-next:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    transform: none;
  }

  /* RESULT */
  .result-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 36px 28px 28px;
    animation: fadeUp 0.5s ease;
  }
  .result-icon { font-size: 46px; margin-bottom: 16px; text-align: center; }
  .result-badge {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--pink-dark);
    background: var(--pink-light);
    border-radius: 20px;
    padding: 4px 14px;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .result-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 20px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .result-msg {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.85;
    background: var(--pink-light);
    border-radius: var(--radius-sm);
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .result-tip {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.75;
    border-left: 2px solid var(--pink-mid);
    padding-left: 14px;
    margin-bottom: 28px;
  }
  .result-tip strong {
    display: block;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--pink);
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .btn-retry {
    background: none;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 24px;
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.15s;
    width: 100%;
  }
  .btn-retry:hover { border-color: var(--pink-mid); color: var(--pink); background: var(--pink-light); }

  /* ANIMATIONS */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* SCREENS */
  .screen { display: none; }
  .screen.active { display: block; }
</style>
</head>
<body>
<div class="container">

  <!-- INTRO -->
  <div id="intro" class="screen active">
    <div class="intro">
      <div class="intro-icon">🌿</div>
      <h1>요즘 내 마음은..?</h1>
      <p>나는 요즘 어떤 얼굴로<br>아이를 만나고 있을까요.<br><br>
      아래 12가지 문장에<br>"자주 그렇다 / 가끔 그렇다 / 거의 아니다"로<br>가볍게 답해보세요 :)</p>
      <button class="btn-next" onclick="startTest()">시작하기</button>
    </div>
  </div>

  <!-- TEST -->
  <div id="test" class="screen">
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
      <div class="progress-label" id="prog-label">1 / 12</div>
    </div>
    <div class="q-card" id="q-card">
      <!-- rendered by JS -->
    </div>
    <div class="nav">
      <button class="btn-back" id="btn-back" onclick="prevQ()">← 이전</button>
      <button class="btn-next" id="btn-next" onclick="nextQ()" disabled>다음</button>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result" class="screen">
    <!-- rendered by JS -->
  </div>

</div>

<script>
const questions = [
  {
    num: "01",
    text: "아이가 \"엄마~\" 하고 부를 때\n속으로 '아, 또' 싶은 마음이 드나요?",
    opts: [
      { e: "😔", t: "자주 그렇다", s: 2 },
      { e: "😅", t: "가끔 그렇다", s: 1 },
      { e: "🙂", t: "거의 아니다", s: 0 },
    ]
  },
  {
    num: "02",
    text: "아이가 밥 먹다 흘리거나\n뭔가 엎질렀을 때,\n생각보다 크게 반응한 적 있나요?",
    opts: [
      { e: "😔", t: "자주 그렇다", s: 2 },
      { e: "😅", t: "가끔 그렇다", s: 1 },
      { e: "🙂", t: "거의 아니다", s: 0 },
    ]
  },
  {
    num: "03",
    text: "\"한 번만 더 말하면…\" 하고\n스스로 경고하면서도\n결국 또 잔소리하게 되나요?",
    opts: [
      { e: "😔", t: "자주 그렇다", s: 2 },
      { e: "😅", t: "가끔 그렇다", s: 1 },
      { e: "🙂", t: "거의 아니다", s: 0 },
    ]
  },
  {
    num: "04",
    text: "아이랑 놀아주면서도\n머릿속은 딴 생각으로\n가득 찬 적 있나요?\n(해야 할 일, 장보기, 답장 등등)",
    opts: [
      { e: "😔", t: "자주 그렇다", s: 2 },
      { e: "😅", t: "가끔 그렇다", s: 1 },
      { e: "🙂", t: "거의 아니다", s: 0 },
    ]
  },
  {
    num: "05",
    text: "아이를 재우고 나서\n\"드디어 혼자다\" 싶은 해방감이\n요즘 더 강하게 느껴지나요?",
    opts: [
      { e: "😔", t: "자주 그렇다", s: 2 },
      { e: "😅", t: "가끔 그렇다", s: 1 },
      { e: "🙂", t: "거의 아니다", s: 0 },
    ]
  },
  {
    num: "06",
    text: "아이가\n\"엄마, 나 오늘 이런 일 있었어~\"\n하고 신나게 얘기하는데\n솔직히 잘 안 들리는 날이 있나요?",
    opts: [
      { e: "😔", t: "자주 그렇다", s: 2 },
      { e: "😅", t: "가끔 그렇다", s: 1 },
      { e: "🙂", t: "거의 아니다", s: 0 },
    ]
  },
  {
    num: "07",
    text: "아이한테 화내고 나서\n\"나 왜 이랬지…\" 하고\n혼자 자책한 밤이 있었나요?",
    opts: [
      { e: "😔", t: "자주 그렇다", s: 2 },
      { e: "😅", t: "가끔 그렇다", s: 1 },
      { e: "🙂", t: "거의 아니다", s: 0 },
    ]
  },
  {
    num: "08",
    text: "누군가 \"요즘 어때요?\" 하고 물으면\n\"괜찮아요\" 하고 넘기는 편인가요?\n사실 괜찮지 않은데도요.",
    opts: [
      { e: "😔", t: "자주 그렇다", s: 2 },
      { e: "😅", t: "가끔 그렇다", s: 1 },
      { e: "🙂", t: "거의 아니다", s: 0 },
    ]
  },
  {
    num: "09",
    text: "몸이 피곤한 건 아는데\n\"조금만 더, 조금만 더\" 하면서\n쉬는 걸 자꾸 미루게 되나요?",
    opts: [
      { e: "😔", t: "자주 그렇다", s: 2 },
      { e: "😅", t: "가끔 그렇다", s: 1 },
      { e: "🙂", t: "거의 아니다", s: 0 },
    ]
  },
  {
    num: "10",
    text: "\"나 오늘 좀 힘들어\"라는 말을\n아이한테도, 남편한테도, 친구한테도\n제대로 꺼내지 못한 날이 많았나요?",
    opts: [
      { e: "😔", t: "자주 그렇다", s: 2 },
      { e: "😅", t: "가끔 그렇다", s: 1 },
      { e: "🙂", t: "거의 아니다", s: 0 },
    ]
  },
  {
    num: "11",
    text: "아이 얼굴이 조금 어두워 보이면\n\"내가 뭘 잘못한 건 아닐까\" 하고\n괜히 마음이 불안해지나요?",
    opts: [
      { e: "😔", t: "자주 그렇다", s: 2 },
      { e: "😅", t: "가끔 그렇다", s: 1 },
      { e: "🙂", t: "거의 아니다", s: 0 },
    ]
  },
  {
    num: "12",
    text: "오늘 하루 별일 없이 지나갔는데도\n자려고 누우면 '좀 더 잘해줄걸' 싶은\n마음이 올라오나요?",
    opts: [
      { e: "😔", t: "자주 그렇다", s: 2 },
      { e: "😅", t: "가끔 그렇다", s: 1 },
      { e: "🙂", t: "거의 아니다", s: 0 },
    ]
  }
];

const results = [
  {
    range: [0, 8],
    icon: "🌱",
    label: "아직 마음에 봄이 남아 있는 얼굴",
    title: "아이를 바라볼\n여유가 아직 남아 있어요",
    msg: "완벽해서가 아니라,\n스스로를 너무 오래 방치하지 않았다는 뜻일지도 몰라요.\n\n다만 이런 엄마일수록\n괜찮은 척 버티다가 갑자기 지치기도 해요.\n\"나도 힘들 수 있다\"는 걸 잊지 마세요 :)",
    tip: "✔ 추천 루틴\n하루 10분 혼자 걷기\n아이와 자기 전 \"오늘 웃겼던 일\" 하나씩 말하기\n\n✔ 이런 말 자주 들려주세요\n\"엄마는 네 얘기 듣는 시간이 좋아.\""
  },
  {
    range: [9, 16],
    icon: "🌥️",
    label: "마음이 조금 흐려진 얼굴",
    title: "요즘 엄마 마음 탱크가\n조금 비어 있는 상태예요",
    msg: "아이를 사랑하지 않아서가 아니라,\n계속 참고 버티느라\n표정이 먼저 지쳐가는 중일지도 몰라요.\n\n아이들은 말보다\n엄마 얼굴의 온도를 먼저 읽으니까요.",
    tip: "✔ 요즘 줄여야 하는 말\n\"빨리 좀 해\" / \"왜 그것도 안 되니?\"\n\n✔ 대신 이렇게 바꿔보세요\n\"엄마가 오늘 조금 지쳤어. 같이 천천히 해보자.\"\n\n✔ 지금 필요한 것\n혼자만의 시간 / 잘 쉬는 연습 / '좋은 엄마' 잠깐 내려놓기"
  },
  {
    range: [17, 24],
    icon: "🌧️",
    label: "마음이 많이 지쳐 있는 얼굴",
    title: "지금의 엄마는\n아이보다 먼저 돌봄이\n필요한 상태일 수 있어요",
    msg: "계속 긴장한 마음으로 버티다 보면\n표정이 먼저 거칠어지고,\n그 다음 말이 날카로워지곤 하니까요.\n\n그런데 이상하게도,\n엄마들은 자기 지침에는 참 둔해요.\n\n\"나는 요즘 많이 애쓰고 있었구나.\"\n그 말을, 오늘 스스로에게 먼저 해주세요.",
    tip: "✔ 먼저 기억했으면 하는 말\n\"나는 요즘 많이 애쓰고 있었구나.\"\n\n✔ 지금 필요한 것\n억지 긍정 말고 진짜 휴식\n혼자 있는 시간 / 누군가에게 기대기\n잘하려는 마음 조금 내려놓기\n\n✔ 아이에게 꼭 해주세요\n\"엄마가 요즘 조금 힘들었나 봐.\n그래도 엄마는 널 정말 사랑해.\""
  }
];

let curr = 0;
let answers = new Array(questions.length).fill(null);

function show(id) {
  ['intro','test','result'].forEach(s => {
    document.getElementById(s).classList.remove('active');
  });
  document.getElementById(id).classList.add('active');
}

function startTest() {
  curr = 0;
  answers = new Array(questions.length).fill(null);
  show('test');
  renderQ();
}

function renderQ() {
  const q = questions[curr];
  const pct = (curr / questions.length) * 100;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = (curr + 1) + ' / ' + questions.length;

  const backBtn = document.getElementById('btn-back');
  backBtn.className = 'btn-back' + (curr === 0 ? ' hidden' : '');

  const nextBtn = document.getElementById('btn-next');
  nextBtn.textContent = curr === questions.length - 1 ? '결과 보기' : '다음';
  nextBtn.disabled = answers[curr] === null;

  const sel = answers[curr];
  document.getElementById('q-card').innerHTML = `
    <div class="q-num">Q${q.num}</div>
    <div class="q-text">${q.text.replace(/\n/g, '<br>')}</div>
    <div class="opts">${q.opts.map((o, i) =>
      `<button class="opt${sel === i ? ' selected' : ''}" onclick="pick(${i})">
        <span class="opt-emoji">${o.e}</span>
        <span>${o.t}</span>
      </button>`
    ).join('')}</div>
  `;
}

function pick(i) {
  answers[curr] = i;
  document.getElementById('btn-next').disabled = false;
  renderQ();
}

function nextQ() {
  if (answers[curr] === null) return;
  if (curr < questions.length - 1) {
    curr++;
    renderQ();
  } else {
    showResult();
  }
}

function prevQ() {
  if (curr > 0) { curr--; renderQ(); }
}

function showResult() {
  const total = answers.reduce((sum, a, i) => {
    if (a === null) return sum;
    return sum + questions[i].opts[a].s;
  }, 0);

  let res = results[results.length - 1];
  for (const r of results) {
    if (total >= r.range[0] && total <= r.range[1]) { res = r; break; }
  }

  document.getElementById('result').innerHTML = `
    <div class="result-card">
      <div class="result-icon">${res.icon}</div>
      <div style="text-align:center">
        <span class="result-badge">${res.label}</span>
      </div>
      <div class="result-title" style="text-align:center">${res.title.replace(/\n/g, '<br>')}</div>
      <div class="result-msg">${res.msg.replace(/\n/g, '<br>')}</div>
      <div class="result-tip">
        <strong>오늘의 작은 마음챙김 🌱</strong>
        ${res.tip.replace(/\n/g, '<br>')}
      </div>
      <button class="btn-retry" onclick="startTest()">↺ 다시 해보기</button>
    </div>
  `;
  show('result');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
</body>
</html>
